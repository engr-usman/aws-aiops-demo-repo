<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat with Your Cluster</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 30px;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header span { color: #64748b; font-size: 13px; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  .msg-user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
    padding: 12px 18px;
    border-radius: 14px 14px 2px 14px;
    max-width: 70%;
    font-size: 15px;
  }

  .agent-block {
    align-self: flex-start;
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tool-step {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: "SF Mono", Monaco, monospace;
    font-size: 13px;
    color: #93c5fd;
    animation: fadeIn 0.3s ease-in;
  }
  .tool-step .icon { font-size: 14px; }
  .tool-step.done { color: #86efac; border-color: #166534; }

  .final-answer {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px 14px 14px 2px;
    padding: 18px 22px;
    font-size: 15px;
    line-height: 1.6;
    animation: fadeIn 0.4s ease-in;
  }
  .final-answer table {
    border-collapse: collapse;
    width: 100%;
    margin: 10px 0;
    font-size: 13px;
  }
  .final-answer th, .final-answer td {
    border: 1px solid #334155;
    padding: 6px 10px;
    text-align: left;
  }
  .final-answer th { background: #0f172a; }
  .final-answer code {
    background: #0f172a;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .final-answer pre {
    background: #0f172a;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
  }
  .final-answer h2, .final-answer h3 {
    margin: 14px 0 6px 0;
    color: #93c5fd;
  }
  .final-answer hr {
    border: none;
    border-top: 1px solid #334155;
    margin: 14px 0;
  }
  .final-answer ol {
    margin: 8px 0;
    padding-left: 22px;
  }
  .final-answer li { margin: 4px 0; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #input-bar {
    border-top: 1px solid #1e293b;
    padding: 20px 30px;
    display: flex;
    gap: 12px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  #question {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px 16px;
    color: white;
    font-size: 15px;
    outline: none;
  }
  #question:focus { border-color: #2563eb; }
  #send {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:hover { background: #1d4ed8; }
  #send:disabled { background: #334155; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Chat with Your Cluster</h1>
  <span>AI-powered EKS troubleshooting agent</span>
</header>

<div id="chat"></div>

<div id="input-bar">
  <input id="question" type="text" placeholder="Ask about your cluster... e.g. 'Something seems wrong in demo-app, can you check?'" />
  <button id="send">Ask</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('question');
const sendBtn = document.getElementById('send');

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function simpleMarkdownToHtml(text) {
  let html = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // Code blocks (```...```) — handle before inline code
  html = html.replace(/```([\s\S]*?)```/g, (match, code) => `<pre>${code.trim()}</pre>`);

  // Headings
  html = html.replace(/^### (.*$)/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.*$)/gm, "<h2>$1</h2>");

  // Bold and inline code
  html = html.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");

  // Horizontal rule
  html = html.replace(/^---$/gm, "<hr>");

  // Numbered list items → wrap consecutive ones in <ol>
  const lines = html.split("\n");
  let out = [];
  let inTable = false;
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (/^\|.*\|$/.test(line.trim())) {
      if (!inTable) { out.push("<table>"); inTable = true; }
      if (/^\|[\s-:|]+\|$/.test(line.trim())) continue;
      const cells = line.trim().slice(1, -1).split("|").map(c => c.trim());
      const tag = out[out.length - 1] === "<table>" ? "th" : "td";
      out.push("<tr>" + cells.map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>");
      continue;
    } else if (inTable) {
      out.push("</table>"); inTable = false;
    }

    const listMatch = line.match(/^\d+\.\s+(.*)/);
    if (listMatch) {
      if (!inList) { out.push("<ol>"); inList = true; }
      out.push(`<li>${listMatch[1]}</li>`);
      continue;
    } else if (inList) {
      out.push("</ol>"); inList = false;
    }

    out.push(line);
  }
  if (inTable) out.push("</table>");
  if (inList) out.push("</ol>");

  return out.join("<br>").replace(/<br>(<h[23]>)/g, "$1").replace(/(<\/h[23]>)<br>/g, "$1")
             .replace(/<br>(<ol>|<\/ol>|<hr>)/g, "$1").replace(/(<ol>|<\/ol>|<hr>)<br>/g, "$1")
             .replace(/<br>(<pre>)/g, "$1").replace(/(<\/pre>)<br>/g, "$1");
}

async function askAgent() {
  const question = input.value.trim();
  if (!question) return;

  addUserMessage(question);
  input.value = "";
  sendBtn.disabled = true;

  const agentBlock = document.createElement('div');
  agentBlock.className = 'agent-block';
  chat.appendChild(agentBlock);
  chat.scrollTop = chat.scrollHeight;

  const response = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question })
  });

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    const parts = buffer.split("\n\n");
    buffer = parts.pop();

    for (const part of parts) {
      if (!part.startsWith("data: ")) continue;
      const event = JSON.parse(part.slice(6));

      if (event.type === "tool_call") {
        const step = document.createElement('div');
        step.className = 'tool-step';
        step.innerHTML = `<span class="icon">⚙️</span> Calling <b>${event.tool}</b>(${JSON.stringify(event.input)})`;
        agentBlock.appendChild(step);
        chat.scrollTop = chat.scrollHeight;
      }

      if (event.type === "tool_result") {
        const steps = agentBlock.querySelectorAll('.tool-step');
        const last = steps[steps.length - 1];
        if (last) {
          last.classList.add('done');
          last.querySelector('.icon').textContent = '✅';
        }
      }

      if (event.type === "final") {
        const final = document.createElement('div');
        final.className = 'final-answer';
        final.innerHTML = simpleMarkdownToHtml(event.text);
        agentBlock.appendChild(final);
        chat.scrollTop = chat.scrollHeight;
      }
    }
  }

  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', askAgent);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') askAgent(); });
</script>

</body>
</html>
